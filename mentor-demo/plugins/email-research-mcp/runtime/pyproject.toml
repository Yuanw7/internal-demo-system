[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "internal-research-hub"
version = "0.2.0.dev0"
description = "Local versioned retrieval hub with HTTP and MCP transports"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "fonttools>=4,<5",
  "httpx>=0.27,<1",
  "mcp>=1.26,<2",
  "pydantic>=2.10,<3",
  "pypdf>=5,<7",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2"]
semantic = ["fastembed>=0.7,<1"]

[project.scripts]
research-hub = "research_hub.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
research_hub = ["config/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
